name: Build Revit Add-in

on:
  push:
    paths:
      - "revit-addin/**"
      - ".github/workflows/build-addin.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Release)
        run: dotnet build revit-addin/PanelScheduleSync/PanelScheduleSync.csproj -c Release

      - name: Package add-in
        shell: pwsh
        run: |
          # Revit 2025 = net8.0-windows, Revit 2023 = net48 (plus dependensi
          # System.Text.Json dkk yang harus ikut di folder add-in)
          $targets = @(
            @{ rv = "2025"; tfm = "net8.0-windows" },
            @{ rv = "2023"; tfm = "net48" }
          )
          foreach ($t in $targets) {
            $dir = "package-$($t.rv)/PanelScheduleSync"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Copy-Item "revit-addin/PanelScheduleSync/bin/Release/$($t.tfm)/*.dll" $dir
            Copy-Item revit-addin/PanelScheduleSync.addin "package-$($t.rv)/"
            Copy-Item revit-addin/README.md "package-$($t.rv)/INSTALL.md"
          }

      - name: Upload artifact (Revit 2025)
        uses: actions/upload-artifact@v4
        with:
          name: PanelScheduleSync-Revit2025
          path: package-2025

      - name: Upload artifact (Revit 2023)
        uses: actions/upload-artifact@v4
        with:
          name: PanelScheduleSync-Revit2023
          path: package-2023
